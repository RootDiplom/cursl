<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: Arial, sans-serif;
            overflow: hidden;
            cursor: pointer;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .heart {
            font-size: 100px;
            color: #e91e63;
            text-shadow: 0 0 20px rgba(233, 30, 99, 0.7);
            transition: transform 0.3s;
            user-select: none;
        }

        .heart:hover {
            transform: scale(1.1);
        }

        .heart:active {
            transform: scale(0.9);
        }

        .message {
            position: absolute;
            font-size: 30px;
            color: #e91e63;
            opacity: 0;
            transition: opacity 1s;
        }

        .particle {
            position: absolute;
            background: #e91e63;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="heart">❤️</div>
    <div class="message">Люблю тебя!</div>

    <script>
        const heart = document.querySelector('.heart');
        const message = document.querySelector('.message');
        const body = document.body;

        // Список возможных сообщений
        const messages = ["Люблю тебя!", "Скучаю!", "Ты лучшая!", "❤️"];

        heart.addEventListener('click', () => {
            // Случайное сообщение
            message.textContent = messages[Math.floor(Math.random() * messages.length)];
            
            // Показываем сообщение
            message.style.opacity = '1';
            heart.style.opacity = '0';

            // Создаём частицы
            createParticles();

            // Через 3 секунды возвращаем сердечко
            setTimeout(() => {
                heart.style.opacity = '1';
                message.style.opacity = '0';
            }, 3000);
        });

        function createParticles() {
            // Удаляем старые частицы (если есть)
            document.querySelectorAll('.particle').forEach(el => el.remove());

            // Создаём 30 частиц
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Размер и начальная позиция
                const size = Math.random() * 20 + 5;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${window.innerWidth / 2}px`;
                particle.style.top = `${window.innerHeight / 2}px`;
                
                // Случайный цвет (розовый/красный)
                const hue = 330 + Math.random() * 30;
                particle.style.background = `hsl(${hue}, 100%, 70%)`;
                
                body.appendChild(particle);

                // Анимация разлёта
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                const lifetime = Math.random() * 2000 + 1000;

                let startTime = Date.now();
                
                function animateParticle() {
                    const time = Date.now() - startTime;
                    const progress = time / lifetime;
                    
                    if (progress >= 1) {
                        particle.remove();
                        return;
                    }
                    
                    const distance = speed * time / 20;
                    const x = Math.cos(angle) * distance;
                    const y = Math.sin(angle) * distance;
                    
                    particle.style.transform = `translate(${x}px, ${y}px)`;
                    particle.style.opacity = 1 - progress;
                    
                    requestAnimationFrame(animateParticle);
                }
                
                requestAnimationFrame(animateParticle);
            }
        }
    </script>
</body>
</html>
